[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "rai-privacy-proxy"
version = "0.1.0"
description = "In-process Stage 1 privacy filter for RAI Trust Platform applications"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["rai_privacy_proxy*"]
