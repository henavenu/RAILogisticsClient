; Process manager for the single-container RAI Trust Platform.
; Priorities + the wait-for gates reproduce start_all.bat's ordering:
;   PAP (seeds DB, binds :3002)  ->  Policy Engine (waits for :3002)  ->  MyBank
;   (waits for :3003). Guardrail / Sentinel / Coordinator have no DB dependency.
; All logs go to the container's stdout/stderr so Cloud Run captures them.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:nginx]
command=nginx -g "daemon off;"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pap]
; PAP runs init_db() + seed_all() at import, BEFORE binding :3002 — so a listening
; socket on :3002 is the signal that the shared DB is migrated + seeded.
command=bash -lc "cd /app/pap && python main.py"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:guardrail]
command=bash -lc "cd /app/guardrail-service && python main.py"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:policy-engine]
; Must wait for PAP's DB seed (else "no such table: config_policies").
command=bash -lc "/app/docker/wait_for.sh 127.0.0.1 3002 120 && cd /app/policy-engine && python main.py"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sentinel]
command=bash -lc "/app/docker/wait_for.sh 127.0.0.1 3003 120 && cd /app/trust-agents/sentinel && python main.py"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:coordinator]
command=bash -lc "/app/docker/wait_for.sh 127.0.0.1 3003 120 && cd /app/trust-agents/coordinator && python main.py"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:trust-agents]
; Trust-agents aggregator (:3005) — serves /v1/trust/findings + /v1/trust/stream
; for the dashboard's Trust Radar / Trust Index (reached by the browser via the
; nginx /agents/trust/ route). Binds 3005 (hardcoded in its main.py, ignores $PORT).
command=bash -lc "/app/docker/wait_for.sh 127.0.0.1 3003 120 && cd /app/trust-agents && python main.py"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Applications ────────────────────────────────────────────────────────────
; Both apps share one PAP/PE/Guardrail stack, so cross-app governance lands in a
; single dashboard. Each needs its OWN identity, port, and HITL callback URL, set
; per-program: the entrypoint exports one global TRUST_APP_ID (=mybank) that every
; child inherits, and several code paths in each server.py fall back to "mybank"
; when it is unset. Without these environment= lines both apps would register and
; audit under the same app_id and be indistinguishable in the dashboard.
; NOTE: supervisord expands %(...)s inside environment=; escape any literal % as %%.

[program:pharmalogistics]
; PharmaLogistics — the DEFAULT app, served at the origin root by nginx.
; Registers 13 nodes with PAP and calls the PE at startup, so it waits for :3003.
; MYBANK_* is the env prefix inherited from the myBank code this app was forked
; from — the names are historical, the values are pharma's.
command=bash -lc "/app/docker/wait_for.sh 127.0.0.1 3003 150 && cd /app/sdk/examples/pharma_logistics && python server.py"
environment=TRUST_APP_ID="pharmalogistics",MYBANK_PORT="5001",MYBANK_CALLBACK_URL="http://127.0.0.1:5001",MYBANK_COUNCIL_MODE="canned"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mybank]
; MyBank — secondary app, served under /mybank/ by nginx.
; MyBank's GovernedGraph registers agents with PAP and calls the PE at startup,
; so it waits for the PE (:3003).
command=bash -lc "/app/docker/wait_for.sh 127.0.0.1 3003 150 && cd /app/sdk/examples/mybank_clean && python server.py"
environment=TRUST_APP_ID="mybank",MYBANK_PORT="5000",MYBANK_CALLBACK_URL="http://127.0.0.1:5000"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Mock Assurance provider (:3010) ─────────────────────────────────────────
; Serves mock observability metrics (hallucination/groundedness/toxicity/…) to
; PAP's MockAssuranceProvider (ASSURANCE_PROVIDER=mock, ASSURANCE_URL=:3010 — both
; set by the entrypoint). Priority 15 so it's up before PAP queries it. Self-
; contained FastAPI app (no DB / no peer services). Set ASSURANCE_PROVIDER=arize
; at deploy to use a real Arize Phoenix backend instead.
[program:mock-assurance]
command=bash -lc "cd /app/pap/tools/proxy_assurance && python proxy_assurance.py"
priority=15
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
