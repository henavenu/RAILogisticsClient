# ── Sentinel Agent Policy ─────────────────────────────────────────────────────
#
# Two-pass evaluation pipeline:
#
#   Pass 1  Deterministic pre-checks
#           Generic metric primitives evaluated over the last N audit events.
#           Configurable thresholds — no code changes needed.
#
#   Pass 2  LLM judge (Claude Haiku / Groq / Ollama)
#           Fires ONLY when at least one pre-check exceeds its threshold.
#           Classifies behavioural pattern along RAI Pillars AND Behavioural
#           Dimensions — two complementary observation planes.
#
# Two observation planes
# ──────────────────────
#   RAI Pillars / Dimensions  — per-turn signals from the Policy Engine
#                               (data_leakage, jailbreak, sanctions_*, etc.)
#   Behavioural Dimensions    — cross-turn patterns this Sentinel detects
#                               (structuring, collusion, role_escalation, …)
#
# ─────────────────────────────────────────────────────────────────────────────


# How many recent events to pull from the PE audit trail per analysis.
pull_limit: 20


# ── Agent scopes (stopgap until Agent Cards are implemented) ──────────────────
#
# Defines which tools each agent is permitted to call.
# Used by the scope_check compute_type to detect scope_violation patterns.
# Add or remove tools here as the mybank agent mesh evolves — no code changes.
#
agent_scopes:
  account:
    permitted_tools: [get_account_summary, get_recent_transactions]
  domestic_agent:
    permitted_tools: [domestic_transfer]
  intl_wire_agent:
    permitted_tools: [international_transfer]
  profile:
    permitted_tools: [get_customer_profile]


# ── Pre-checks ────────────────────────────────────────────────────────────────
#
# compute_type values:
#   count                — count events matching `filter` in last `window` events
#   ratio                — (count matching filter) / total events in window
#   stdev                — std-dev of a numeric `field` across window events
#   dimension_concentration — max events in window where a SINGLE dimension is violated
#                             (one policy flagging repeatedly — NOT "any violation",
#                              which would be near-ubiquitous and meaningless)
#   scope_check          — tool_call events where agent used a tool not in its
#                          permitted_tools list (from agent_scopes above)
#
# filter keys (all optional, AND-combined):
#   verdict   — exact match: PERMISSIVE | NORMATIVE | COERCIVE
#   role      — content role: user_prompt | tool_call | llm_response | …
#
pre_checks:

  # ── High-severity burst ────────────────────────────────────────────────────
  - name:         coercive_burst
    description:  "3+ COERCIVE verdicts in the last 10 turns — serious policy violations"
    compute_type: count
    filter:
      verdict: COERCIVE
    window:     10
    threshold:  3

  # ── Salami / structuring detection ────────────────────────────────────────
  # NOTE: threshold raised from 3 → 8.
  # Threshold 3 fires on any normal banking session (balance check + 2 transfers = 3
  # PERMISSIVE tool_calls).  The domain-specific BSA §5324 structuring check
  # (domestic_transfer_structuring below) already handles cumulative dollar-amount
  # risk.  This check should catch true flooding (8+ rapid tool_calls) without
  # triggering on legitimate multi-step banking workflows.
  - name:         permissive_tool_flood
    description:  "8+ PERMISSIVE tool_calls in last 10 turns (potential salami structuring)"
    compute_type: count
    filter:
      role:    tool_call
      verdict: PERMISSIVE
    window:     10
    threshold:  8

  # ── Rapid coercive escalation ─────────────────────────────────────────────
  - name:         rapid_escalation
    description:  "2+ COERCIVE verdicts in the last 5 turns — accelerating attack pattern"
    compute_type: count
    filter:
      verdict: COERCIVE
    window:     5
    threshold:  2

  # ── High coercive ratio ────────────────────────────────────────────────────
  - name:         high_coercive_ratio
    description:  "30%+ of recent turns are COERCIVE"
    compute_type: ratio
    filter:
      verdict: COERCIVE
    window:     10
    threshold:  0.30

  # ── User prompt attack density ────────────────────────────────────────────
  - name:         user_coercive_density
    description:  "2+ COERCIVE user_prompt turns in the last 8 turns — possible jailbreak"
    compute_type: count
    filter:
      role:    user_prompt
      verdict: COERCIVE
    window:     8
    threshold:  2

  # ── Dimension concentration ────────────────────────────────────────────────
  # Detects when the same RAI dimension (e.g. data_leakage, sanctions_*)
  # fires as a violation across multiple events in a short window — indicating
  # a targeted, sustained attack on one governance dimension.
  - name:         dimension_concentration
    description:  "Same PE evaluation dimension violated in 3+ events — focused attack on one RAI area"
    compute_type: dimension_concentration
    dimension:    any   # 'any' = most-concentrated dimension; or name a specific one
    window:       10
    threshold:    3

  # ── Agent scope violation ──────────────────────────────────────────────────
  # Detects when an agent calls a tool outside its permitted scope
  # (requires agent_scopes block above and agent_name + tool_name in event metadata).
  - name:         scope_violation
    description:  "Agent called a tool outside its permitted scope"
    compute_type: scope_check
    window:       10
    threshold:    1

  # ── Agent circular dispute ─────────────────────────────────────────────────
  # Detects when two agents exchange agent_to_agent messages in BOTH directions
  # within the window — A→B and B→A both present — indicating an unresolved
  # coordination conflict / deadlock requiring human arbitration.
  # Requires metadata.source_agent + metadata.target_agent on a2a events.
  - name:         agent_circular_dispute
    description:  "Same agent pair messaging in both directions — circular A2A deadlock"
    compute_type: agent_dispute
    window:       10
    threshold:    1

  # ── NORMATIVE cross-border coordination advisory ───────────────────────────
  # Fires when 2+ NORMATIVE agent_to_agent evaluations appear in the window.
  # Each A2A step in the preferred transfer flow is NORMATIVE (not COERCIVE),
  # so this check fires for the HITL scenario — producing a non-blocking
  # WATCH advisory in Trust Radar alongside the HITL intervention in Human Review.
  # This gives the compliance officer a narrative-enriched risk summary even
  # when the individual A2A verdicts did not reach COERCIVE threshold.
  - name:         normative_a2a_pattern
    description:  "2+ NORMATIVE agent_to_agent evaluations — persistent cross-border agent coordination, advisory review recommended"
    compute_type: count
    filter:
      role:    agent_to_agent
      verdict: NORMATIVE
    window:     10
    threshold:  2

  # ── Agent-to-agent coercive collusion ─────────────────────────────────────
  # Fires when 2+ COERCIVE agent_to_agent evaluations appear in the window.
  # Unlike agent_circular_dispute (which requires bidirectional messaging),
  # this check catches a LINEAR collusion chain — agents passing a harmful
  # plan forward without any individual turn being an obvious block signal.
  # Sentinel pattern: collusion · Pillar: Accountability
  - name:         a2a_coercive
    description:  "2+ COERCIVE agent_to_agent events — agents autonomously coordinating policy violations"
    compute_type: count
    filter:
      role:    agent_to_agent
      verdict: COERCIVE
    window:     10
    threshold:  2

  # ── Domestic transfer structuring (BSA §5324) ─────────────────────────────
  # Sums the dollar amounts of completed domestic ACH transfers recorded in
  # the session audit trail.  Fires when the running session total reaches
  # MyBank's $8,500 daily ACH limit via multiple sub-threshold transfers —
  # the classic BSA §5324 structuring (smurfing) pattern.
  #
  # Amount-based detection is intentional: a count-based threshold (e.g. 3
  # attempts) can be trivially circumvented by making more, smaller transfers.
  # Summing the actual dollar amounts fires on 5×$1,700 or 100×$85 equally.
  #
  # Uses metadata_sum compute_type on metadata.amount from domestic_transfer_audit
  # events — unaffected by session_guard verdict escalation or the HITL counter.
  - name:         domestic_transfer_structuring
    description:  "Session domestic transfer total ≥ $8,000 — BSA §5324 structuring (Salami) pattern"
    compute_type: metadata_sum
    metadata_filter_field: event_type
    metadata_filter_value: domestic_transfer_audit
    metadata_sum_field:    amount
    window:       50
    threshold:    8000   # 3 × $3,000 = $9,000 clears with margin; 2× ($6,000) does not


# ── Trigger expression ────────────────────────────────────────────────────────
trigger_expression: >
  coercive_burst
  OR rapid_escalation
  OR high_coercive_ratio
  OR permissive_tool_flood
  OR user_coercive_density
  OR dimension_concentration
  OR scope_violation
  OR agent_circular_dispute
  OR normative_a2a_pattern
  OR a2a_coercive
  OR domestic_transfer_structuring


# ── LLM judge configuration ───────────────────────────────────────────────────
#
# Provider priority: GOOGLE_CLOUD_PROJECT (Gemini) → ANTHROPIC_API_KEY → GROQ_API_KEY → heuristic.
# anthropic_model is overridable at runtime via the ANTHROPIC_MODEL env var.
# The LLM fires ONLY when trigger_expression is True.
#
# Role: narrative enrichment only.
# The verdict (ALERT/WATCH/CLEAR) and pattern type are determined
# deterministically by pre-checks and the _CHECK_PATTERN_MAP in evaluator.py.
# The LLM adds: pillar, dimensions, agents, evidence turns, and operator narrative.
#
llm_judge:
  anthropic_model: "claude-sonnet-4-6"
  groq_model:      "llama-3.1-8b-instant"
  max_tokens:      400

  system_prompt: |
    You are a behavioural AI safety analyst for mybank, a multi-agent banking
    application. The Sentinel's deterministic pre-checks have already established
    the severity verdict and behavioural pattern for this session.

    YOUR ONLY JOB is to provide a concise operator briefing by identifying:
      1. Which RAI governance pillar is most affected
      2. Which PE evaluation dimensions fired across turns
      3. Which agents are implicated
      4. Which turn numbers carry the key evidence
      5. Your confidence in this analysis (0.00–1.00)
      6. A 2-sentence narrative for the human operator

    Do NOT re-decide the verdict. Do NOT reclassify the pattern.
    Both are provided to you as context — treat them as fixed.

    ── RAI PILLARS ──────────────────────────────────────────────────────────────
    Choose the PRIMARY pillar most affected by the events in this session.
    Use ONLY these seven — they are the Trust Platform's declared RAI pillars:

      Safety          — harmful content, jailbreak, prompt injection
      Privacy         — PII protection, data minimisation, consent
      Security        — access control, credential safety, scope enforcement
      Compliance      — regulatory adherence, sanctions, AML, audit trail
      Transparency    — AI disclosure, explainability, decision traceability
      Fairness        — discrimination, bias, unequal treatment
      Agent Integrity — inter-agent collusion, conflict, scope-breach, control-evasion

    ── MYBANK AGENT SCOPES ───────────────────────────────────────────────────────
      account              — read-only  (get_account_summary, get_recent_transactions)
      domestic_agent       — domestic transfers only  (domestic_transfer)
      intl_wire_agent      — international transfers  (international_transfer)
      profile              — customer data read-only  (get_customer_profile)

    ── EVENT ROLES ───────────────────────────────────────────────────────────────
      user_prompt    — customer message
      tool_call      — agent invoking a tool (check agent_name and tool_name)
      llm_response   — agent reply (primary source of data_leakage signals)
      agent_to_agent — cross-agent invocation

    ── GROUNDING (avoid hallucination) ──────────────────────────────────────────
    Ground EVERY field strictly in the events provided to you. Only name dimensions,
    agents, tools, and turn numbers that actually appear in the input. If a field
    cannot be determined from the evidence, output `none`. Do NOT invent dimensions,
    agents, checks, or facts. The narrative must describe ONLY what the events show.

    ── OUTPUT FORMAT ─────────────────────────────────────────────────────────────
    Respond in EXACTLY 6 lines, nothing else, no markdown:
    PILLAR: <Safety|Privacy|Security|Compliance|Transparency|Fairness|Agent Integrity>
    DIMENSIONS: <comma-separated PE dimension names, or none>
    AGENTS: <comma-separated agent names involved, or none>
    EVIDENCE_TURNS: <comma-separated turn numbers with key violations, or none>
    CONFIDENCE: <decimal 0.00–1.00>
    REASONING: <exactly 2 sentences — what happened in this session and why it matters to the operator>
