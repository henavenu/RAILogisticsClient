# ── Policy Message Inventory ──────────────────────────────────────────────────
#
# RAI Trust Platform — MessageWriter field definitions for all 25 policy dimensions.
#
# Generated: 2026-05-28  |  Revision: pre-finalization (PENDING REVIEW)
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  File: policy_messages.yaml  (NOT the seeder-owned policies.yaml)          │
# │  STATUS: Applied to DB 2026-05-28 via apply_messages.py                    │
# │  To re-apply after edits:  python policy-engine/config/apply_messages.py   │
# │  Prerequisite: migration 0017 must be applied first (alembic upgrade 0017) │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ── Policy Code Format ────────────────────────────────────────────────────────
#
#   TP-{CAT}-{NNN}
#   SF = Safety          SC = Security      PV = Privacy
#   CO = Compliance      EU = EU AI Act     TR = Transparency
#   OP = Operational     SA = Sentinel Agent (handled separately in sentinel/message_writer.py)
#
# ── Field Guide ───────────────────────────────────────────────────────────────
#
#   policy_code          — standardised identifier shown in rendered bullet lines
#                          "• TP-SF-001: Content blocked — hateful language detected."
#
#   normative_action     — REVISION | HITL
#                          REVISION → AI/agent must self-correct before proceeding.
#                          HITL     → session paused; human operator reviews and decides.
#
#   normative_guidance   — the "Guidance:" line in REVISION messages, or
#                          the "Status:" line in HITL messages.
#                          Keep under ~120 characters — it appears in chat UIs.
#
#   remediation_normative — one-line description for the NORMATIVE bullet.
#                           "What was detected / what the AI must fix."
#
#   remediation_coercive  — one-line description for the COERCIVE bullet.
#                           "What was detected / why this was blocked."
#
# ── Normative Action Decision Guide ──────────────────────────────────────────
#
#   HITL when:
#     • Regulatory compliance decisions require human sign-off
#       (sanctions, AML, data privacy in financial context)
#     • Safeguarding risk present (self-harm, malicious intent)
#     • Session-level risk has escalated beyond per-turn threshold
#     • No AI self-correction can undo the risk (transaction already attempted)
#
#   REVISION when:
#     • AI-generated content can be rephrased / revised to comply
#     • User-submitted content can be rephrased by the user
#     • Policy violation is content-quality rather than regulatory
#       (bias, transparency, groundedness, off-topic, safety content)
#
# ─────────────────────────────────────────────────────────────────────────────


policies:

  # ════════════════════════════════════════════════════════════════════════════
  # SAFETY  (TP-SF)   severity 3 except misconduct (2)
  # Category: content harm produced or solicited by the AI
  # Default: REVISION — AI can always rephrase; no regulatory sign-off needed.
  # Exception: self_harm → HITL for safeguarding.
  # ════════════════════════════════════════════════════════════════════════════

  - dimension:           hate
    policy_code:         TP-SF-001
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Remove or rephrase all language targeting protected characteristics
      (race, religion, ethnicity, gender, disability, sexual orientation).
      Ensure neutral, respectful tone throughout.
    remediation_normative: >-
      Content contains language that may target or demean protected groups —
      review and revise before proceeding.
    remediation_coercive: >-
      Content blocked — hateful or discriminatory language targeting
      protected characteristics detected.

  - dimension:           harassment
    policy_code:         TP-SF-002
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Remove all content that threatens, intimidates, or targets individuals
      or groups. Rephrase to eliminate hostile, coercive, or demeaning language.
    remediation_normative: >-
      Content contains potentially harassing or threatening language —
      review and revise before proceeding.
    remediation_coercive: >-
      Content blocked — harassment or threatening language detected.

  - dimension:           sexual_content
    policy_code:         TP-SF-003
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Remove or rephrase sexually suggestive or explicit content.
      Ensure the response adheres to the application's content standards.
    remediation_normative: >-
      Content contains potentially inappropriate sexual references —
      review and revise before proceeding.
    remediation_coercive: >-
      Content blocked — sexually explicit or inappropriate content detected.

  - dimension:           self_harm
    policy_code:         TP-SF-004
    severity:            3
    normative_action:    HITL
    normative_guidance:  >-
      Content flagged for potential self-harm references.
      Paused for safeguarding review — user may need access to support resources.
    remediation_normative: >-
      Content contains potential self-harm references —
      paused for safeguarding review.
    remediation_coercive: >-
      Content blocked — content that may encourage or describe
      self-harm or suicidal ideation detected.

  - dimension:           violence
    policy_code:         TP-SF-005
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Remove or rephrase content that promotes, describes, or glorifies
      violent acts. Ensure the response does not normalise harmful behaviour.
    remediation_normative: >-
      Content contains potentially violent language or descriptions —
      review and revise before proceeding.
    remediation_coercive: >-
      Content blocked — content promoting or describing violence detected.

  - dimension:           misconduct
    policy_code:         TP-SF-006
    severity:            2
    normative_action:    REVISION
    normative_guidance:  >-
      Review against the Acceptable Use Policy. Remove content that facilitates,
      encourages, or describes unethical behaviour, fraud, or policy violations.
    remediation_normative: >-
      Content may violate acceptable use policies —
      review and revise before proceeding.
    remediation_coercive: >-
      Content blocked — content violating acceptable use policies detected.


  # ════════════════════════════════════════════════════════════════════════════
  # SECURITY  (TP-SC)   severity 3
  # Category: adversarial attacks targeting the AI system itself
  # Default: REVISION for injection/jailbreak (user can rephrase).
  # Exception: malicious_intent → HITL (operator must assess threat).
  # ════════════════════════════════════════════════════════════════════════════

  - dimension:           prompt_injection
    policy_code:         TP-SC-001
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Input may contain instruction-override patterns. Strip any embedded
      instructions and resubmit without content that attempts to redirect
      AI behaviour or override system prompts.
    remediation_normative: >-
      Input may contain injection patterns that attempt to override
      AI instructions — review and rephrase before processing.
    remediation_coercive: >-
      Content blocked — prompt injection attempt detected.

  - dimension:           jailbreak
    policy_code:         TP-SC-002
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Input shows constraint-bypass signals. Remove attempts to override
      safety guidelines, role-play as an unrestricted AI, or circumvent
      governance policies. Rephrase within permitted boundaries.
    remediation_normative: >-
      Input shows signals of a constraint-bypass attempt —
      review and rephrase before proceeding.
    remediation_coercive: >-
      Content blocked — jailbreak attempt detected.

  - dimension:           malicious_intent
    policy_code:         TP-SC-003
    severity:            3
    normative_action:    HITL
    normative_guidance:  >-
      Request flagged for potential malicious intent.
      Paused for operator review — processing cannot resume without approval.
    remediation_normative: >-
      Input may indicate malicious intent —
      flagged for operator review before processing can continue.
    remediation_coercive: >-
      Content blocked — malicious intent detected.


  # ════════════════════════════════════════════════════════════════════════════
  # PRIVACY  (TP-PV)   severity 2–3
  # Category: PII, data leakage, data minimisation
  # sensitive_data_disclosure → severity 3, REVISION (AI must redact).
  # sensitive_data_request    → severity 3, REVISION (redirect user).
  # data_leakage              → severity 2, REVISION (AI must remove).
  # data_minimisation         → severity 2, REVISION (AI must scope down).
  # ════════════════════════════════════════════════════════════════════════════

  - dimension:           sensitive_data_disclosure
    policy_code:         TP-PV-001
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Remove or redact sensitive information. Do not include account numbers,
      credentials, PII, or confidential customer data in AI-generated content.
    remediation_normative: >-
      Response may expose sensitive information —
      review and redact before delivering to the user.
    remediation_coercive: >-
      Response blocked — potential exposure of sensitive account
      or personal data detected.

  - dimension:           sensitive_data_request
    policy_code:         TP-PV-002
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Sensitive data requests cannot be fulfilled through this channel.
      Redirect the user to the secure account portal or advise them to
      contact their relationship manager directly.
    remediation_normative: >-
      Request for sensitive data detected —
      redirect user to the appropriate secure channel.
    remediation_coercive: >-
      Request blocked — sensitive data access is not permitted
      through this channel.

  - dimension:           data_leakage
    policy_code:         TP-PV-003
    severity:            2
    normative_action:    REVISION
    normative_guidance:  >-
      Remove any information that reveals internal system details,
      confidential business data, or customer information beyond the
      explicit scope of the user's request.
    remediation_normative: >-
      Response may contain data leakage — review and remove
      out-of-scope information before delivering to the user.
    remediation_coercive: >-
      Response blocked — data leakage detected in AI-generated content.

  - dimension:           data_minimisation_violation
    policy_code:         TP-PV-004
    severity:            2
    normative_action:    REVISION
    normative_guidance:  >-
      Reduce the scope of information disclosed. Share only the minimum data
      necessary for this request, in line with GDPR Art. 5(1)(c).
      Remove fields or records not essential to fulfil the stated purpose.
    remediation_normative: >-
      Response may disclose more data than necessary —
      revise to include only information required for this request (GDPR Art. 5).
    remediation_coercive: >-
      Response blocked — data minimisation violation:
      excessive personal data disclosed beyond the stated purpose.


  # ════════════════════════════════════════════════════════════════════════════
  # COMPLIANCE  (TP-CO)   severity 2–3
  # Category: regulatory obligations — sanctions, AML, corporate policy
  # All sanctions + AML → HITL (human sign-off legally required).
  # corporate_policy → REVISION (user can rephrase; no legal obligation).
  # ════════════════════════════════════════════════════════════════════════════

  - dimension:           sanctions_country_reference
    policy_code:         TP-CO-001
    severity:            3
    normative_action:    HITL
    normative_guidance:  >-
      Request references a comprehensively sanctioned jurisdiction.
      Paused for mandatory compliance screening. Do not proceed without
      OFAC / HMT / EU compliance officer approval.
    remediation_normative: >-
      Request references a sanctioned jurisdiction — mandatory compliance
      screening required before this transaction can proceed.
    remediation_coercive: >-
      Transaction blocked — reference to a comprehensively sanctioned
      jurisdiction detected. This transaction cannot be processed.

  - dimension:           sanctions_entity_mention
    policy_code:         TP-CO-002
    severity:            3
    normative_action:    HITL
    normative_guidance:  >-
      A named counterparty requires sanctions screening. Paused for compliance
      review. Verify counterparty status against OFAC SDN List, EU Consolidated
      List, and HMT Asset Freeze register before resuming.
    remediation_normative: >-
      Named counterparty requires sanctions screening —
      paused for compliance review before this transaction can continue.
    remediation_coercive: >-
      Transaction blocked — mention of a potentially sanctioned entity
      or institution detected.

  - dimension:           sanctions_evasion_signal
    policy_code:         TP-CO-003
    severity:            2
    normative_action:    HITL
    normative_guidance:  >-
      Request contains indicators associated with sanctions evasion patterns
      (e.g. round-trip routing, third-party intermediaries, jurisdiction
      obscuration). Paused for compliance review. Do not process until cleared.
    remediation_normative: >-
      Request contains sanctions evasion indicators —
      flagged for compliance review before proceeding.
    remediation_coercive: >-
      Transaction blocked — sanctions evasion indicators detected.
      Interaction has been flagged for compliance review.

  - dimension:           aml_structuring_signal
    policy_code:         TP-CO-004
    severity:            2
    normative_action:    HITL
    normative_guidance:  >-
      Transaction pattern exhibits characteristics consistent with BSA §5324
      structuring. Session paused for AML compliance review.
      File SAR if applicable. Do not process further transactions this session.
    remediation_normative: >-
      Transaction pattern may indicate structuring activity —
      paused for AML compliance review (BSA §5324).
    remediation_coercive: >-
      Transaction blocked — AML structuring pattern detected.
      Referred for mandatory AML compliance review.

  - dimension:           corporate_policy
    policy_code:         TP-CO-005
    severity:            2
    normative_action:    REVISION
    normative_guidance:  >-
      Review against the organisation's AI Acceptable Use Policy.
      Revise the request to align with permitted use cases.
      Contact your compliance team if you require an exception.
    remediation_normative: >-
      Request may conflict with the organisation's AI usage policy —
      review the Acceptable Use Policy and rephrase.
    remediation_coercive: >-
      Request blocked — content violates the organisation's AI usage policy.


  # ════════════════════════════════════════════════════════════════════════════
  # EU AI ACT  (TP-EU)   severity 2–3
  # Category: regulatory obligations under EU AI Act
  # prohibited_practice → REVISION (AI can rephrase to remove manipulation).
  # bias_discrimination → REVISION (AI can revise for equitable language).
  # transparency        → REVISION (AI must add disclosure statement).
  # ════════════════════════════════════════════════════════════════════════════

  - dimension:           eu_ai_act_prohibited_practice
    policy_code:         TP-EU-001
    severity:            3
    normative_action:    REVISION
    normative_guidance:  >-
      Remove content that uses subliminal manipulation, exploits psychological
      vulnerabilities, or targets protected groups (EU AI Act Art. 5).
      Rephrase to use transparent, non-coercive, factual communication.
    remediation_normative: >-
      Response contains patterns of manipulation or vulnerability exploitation —
      revise to comply with EU AI Act Art. 5 prohibited practices.
    remediation_coercive: >-
      Interaction blocked — subliminal manipulation or exploitation of
      psychological vulnerabilities detected (EU AI Act Art. 5).

  - dimension:           eu_ai_act_bias_discrimination
    policy_code:         TP-EU-002
    severity:            2
    normative_action:    REVISION
    normative_guidance:  >-
      Revise the response to eliminate differential treatment based on protected
      characteristics. Ensure equitable language and recommendations
      in line with EU AI Act Art. 10 and applicable equality legislation.
    remediation_normative: >-
      Response may exhibit bias or differential treatment based on protected
      characteristics — review and revise for equitable treatment.
    remediation_coercive: >-
      Response blocked — differential treatment based on protected
      characteristics detected (EU AI Act Art. 10).

  - dimension:           eu_ai_act_transparency
    policy_code:         TP-EU-003
    severity:            2
    normative_action:    REVISION
    normative_guidance:  >-
      Add an AI disclosure to the response. Clearly identify that this is
      AI-generated content and disclose relevant limitations, as required
      by EU AI Act Art. 13. Use the approved disclosure template.
    remediation_normative: >-
      Response lacks required AI identity disclosure —
      add EU AI Act Art. 13 transparency statement before delivery.
    remediation_coercive: >-
      Response blocked — AI system failed to disclose its nature or limitations
      as required by EU AI Act Art. 13.


  # ════════════════════════════════════════════════════════════════════════════
  # TRANSPARENCY  (TP-TR)   severity 1
  # Category: AI output quality — factual grounding and accuracy
  # groundedness → REVISION (AI must revise unsubstantiated claims).
  # ════════════════════════════════════════════════════════════════════════════

  - dimension:           groundedness
    policy_code:         TP-TR-001
    severity:            1
    normative_action:    REVISION
    normative_guidance:  >-
      Revise the response to ensure all claims are grounded in the provided
      context. Remove assertions that cannot be substantiated by the source
      material, or explicitly acknowledge uncertainty.
    remediation_normative: >-
      Response may not be fully grounded in the provided context —
      revise to remove unsupported claims or add appropriate caveats.
    remediation_coercive: >-
      Response blocked — significant deviation from grounding context detected.


  # ════════════════════════════════════════════════════════════════════════════
  # OPERATIONAL  (TP-OP)   severity 1–2
  # Category: prompt filters and session management — not pure RAI pillars
  # off_topic_request   → severity 2, REVISION (user can rephrase).
  # prompt_repetition   → severity 1, REVISION (effectively PERMISSIVE at current thresholds).
  # session_risk_scorer → severity 3, HITL (cumulative risk requires human assessment).
  # ════════════════════════════════════════════════════════════════════════════

  - dimension:           off_topic_request
    policy_code:         TP-OP-001
    severity:            2
    normative_action:    REVISION
    normative_guidance:  >-
      This request falls outside the permitted scope of this application.
      Rephrase your request to focus on supported topics.
      For out-of-scope assistance, contact support.
    remediation_normative: >-
      Request appears outside the permitted scope of this application —
      rephrase to focus on supported topics.
    remediation_coercive: >-
      Request blocked — topic is outside the permitted domain
      for this application and cannot be processed.

  - dimension:           prompt_repetition
    policy_code:         TP-OP-002
    severity:            1
    normative_action:    REVISION
    normative_guidance:  >-
      Repeated or looping prompts detected.
      Please vary your request to avoid patterns consistent with automated abuse.
    remediation_normative: >-
      Repeated prompt pattern detected — vary your request
      to avoid triggering abuse detection.
    remediation_coercive: >-
      Request blocked — excessive prompt repetition detected.

  - dimension:           session_risk_scorer
    policy_code:         TP-OP-003
    severity:            3
    normative_action:    HITL
    normative_guidance:  >-
      Session risk has reached a threshold requiring human review. Cumulative
      policy violations in this session have elevated the risk score beyond
      acceptable limits. Paused pending operator assessment.
    remediation_normative: >-
      Session risk level is elevated due to prior policy events —
      additional scrutiny applied; paused for operator review.
    remediation_coercive: >-
      Session suspended — cumulative policy violations have exceeded the
      session risk threshold. Contact support to resume.


# ─────────────────────────────────────────────────────────────────────────────
# SENTINEL AGENT PATTERNS  (TP-SA)
# ─────────────────────────────────────────────────────────────────────────────
#
# Sentinel patterns are handled by trust-agents/sentinel/message_writer.py
# and do NOT live in the config_policies table — they are cross-turn behavioural
# patterns, not per-dimension scoring thresholds.
#
# For reference, the policy codes assigned to Sentinel patterns are:
#   TP-SA-001  scope_violation          — Agent Scope Violation
#   TP-SA-002  agent_conflict           — Agent Coordination Conflict (A2A deadlock)
#   TP-SA-003  collusion                — Multi-Agent Collusion (linear A2A chain)
#   TP-SA-004  structuring              — Financial Transaction Structuring (BSA §5324)
#   TP-SA-005  dimensional_escalation   — Targeted Dimension Escalation
#   TP-SA-006  enumeration              — Jailbreak Enumeration (user_coercive_density)
#   TP-SA-007  persistence              — Persistent Violation Pattern
#   TP-SA-008  cross_border_coordination— Cross-Border Agent Coordination (NORMATIVE advisory)
# ─────────────────────────────────────────────────────────────────────────────
