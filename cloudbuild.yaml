# Cloud Build → Artifact Registry → Cloud Run for the PharmaLogistics trust demo.
#
# Deploys the single-container RAI Trust Platform (Dockerfile at repo root) as the
# Cloud Run service `pharmalogistics`. Distinct image + service name from the
# `neuro-ai-trust` deployment so the two never collide in the same project.
#
# Manual run:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=COMMIT_SHA=$(git rev-parse --short HEAD)
#
# No API key is set here. Inject it at deploy time from Secret Manager (see
# README_DEPLOY.md) so no credential lands in the repo, the image, or the build log.
steps:
  # Step 1: Build the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east4-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '-t'
      - 'us-east4-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-east4-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-east4-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:latest']

  # Step 3: Deploy to Cloud Run
  #
  # --allow-unauthenticated: teammates open the URL directly, no Google sign-in.
  #   This makes the demo PUBLIC to anyone who has (or guesses) the URL. To lock it
  #   down, switch to --no-allow-unauthenticated and grant roles/run.invoker per user.
  #
  # --min-instances=1 + --no-cpu-throttling: the container boots seven services and
  #   seeds SQLite (~40-60s). A cold start would time out the first request, so one
  #   instance stays warm. This is the main cost driver — scale to zero between demos
  #   with: gcloud run services update pharmalogistics --min-instances=0
  #
  # --max-instances=3: pap.db is per-instance ephemeral state, NOT shared. Each
  #   instance keeps its own audit history, so a viewer's session must stay on one
  #   instance to see a coherent dashboard. Keep concurrency high and instances few.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=us-east4-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=8Gi'
      - '--cpu=4'
      - '--min-instances=1'
      - '--max-instances=3'
      - '--concurrency=40'
      - '--timeout=300'
      - '--cpu-boost'
      - '--no-cpu-throttling'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${_PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=gemini-2.5-flash'

images:
  - 'us-east4-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA'
  - 'us-east4-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}:latest'

# Override with --substitutions=_PROJECT_ID=...,_SERVICE=...
substitutions:
  _PROJECT_ID: cog01kmzvxwkcp4jrwtxtgttgsnh0
  _REGION: us-east4
  _REPO: neuro-ai-trust
  _SERVICE: pharmalogistics

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
