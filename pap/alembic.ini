# Alembic configuration — RAI Trust Platform PAP
# Run from the pap/ directory: alembic upgrade head

[alembic]
script_location = alembic

# Default URL — overridden at runtime by PAP_DATABASE_URL env var
sqlalchemy.url = sqlite:///config/pap.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
